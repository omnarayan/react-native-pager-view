name: DeviceLab apps (pager-view example, Release)

on:
  workflow_dispatch:
  push:
    branches:
      - devicelab-build-52a4264
    paths:
      - '.github/workflows/devicelab-apps.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, x86_64]
    steps:
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: bun install

      - name: Install example dependencies
        run: bun install
        working-directory: example

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Release APK (${{ matrix.arch }})
        working-directory: example/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=${{ matrix.arch }} --no-daemon -Dorg.gradle.jvmargs=-Xmx4g

      - name: Collect APK
        run: |
          mkdir -p out
          find example/android -path '*outputs/apk/release/*.apk' -print
          cp "$(find example/android -path '*outputs/apk/release/*.apk' | head -n1)" "out/pager-release-${{ matrix.arch }}.apk"
          unzip -l "out/pager-release-${{ matrix.arch }}.apk" | grep -E 'lib/|assets/' | head -60

      - uses: actions/upload-artifact@v4
        with:
          name: pager-android-${{ matrix.arch }}
          path: out/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: bun install

      - name: Install example dependencies
        run: bun install
        working-directory: example

      - name: Install example Pods
        run: bun pods
        working-directory: example

      - name: Xcode info
        working-directory: example/ios
        run: |
          xcodebuild -version
          xcodebuild -list -workspace PagerViewExample.xcworkspace

      - name: Build iOS simulator app (Release)
        working-directory: example/ios
        run: |
          SCHEME=$(xcodebuild -list -json -workspace PagerViewExample.xcworkspace | jq -r '.workspace.schemes[]' | grep -E '^(PagerViewExample|ReactTestApp)$' | head -n1)
          echo "Using scheme: $SCHEME"
          set -o pipefail
          xcodebuild -workspace PagerViewExample.xcworkspace -scheme "$SCHEME" \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tail -n 200

      - name: Zip .app
        run: |
          mkdir -p out
          APP=$(find example/ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -n1)
          echo "APP=$APP"
          ls -la "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          ditto -c -k --keepParent "$APP" "out/$(basename "$APP" .app)-Release-iphonesimulator.app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pager-ios-sim
          path: out/*.zip
          if-no-files-found: error
